[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikedet"
version = "0.1.0"
description = "Spike detection for extracellular recordings, with a failure-mode benchmark and a streaming detector"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Minka Dubourg" }]
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
analysis = ["matplotlib", "scikit-learn"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["spikedet*"]
